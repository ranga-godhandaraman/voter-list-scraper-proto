[project]
name = "eci-eroll-recon"
version = "1.0.0"
description = "Technical reconnaissance analyzer for voters.eci.gov.in/download-eroll (public APIs only, no mass scraping)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "playwright>=1.40.0",
  "lxml>=5.0.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "networkx>=3.2",
  "rich>=13.7.0",
  "loguru>=0.7.0",
  "typer>=0.12.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "tenacity>=8.2.0",
  "pyyaml>=6.0",
  "pypdf>=4.0.0",
]

[project.scripts]
eci-recon = "analyzer.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analyzer*", "network*", "browser*", "parser*", "report*", "utils*"]

[tool.ruff]
line-length = 100
target-version = "py312"
